name: validate-plugins-json

on:
  pull_request:
    paths:
      - 'data/plugins.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data/plugins.json
        run: node scripts/validate.mjs data/plugins.json
